<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de PIX</title>
<style>
  :root{--bg:#0f1420;--card:#171e2e;--bd:#28324a;--tx:#e8ecf5;--mut:#8b96b0;--ac:#2ecc8f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;display:flex;justify-content:center;padding:20px}
  main{width:100%;max-width:440px}
  h1{font-size:22px;margin:8px 0 16px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:#0f1420;color:var(--tx);font-size:16px}
  input.valor{font-size:28px;font-weight:700;text-align:center}
  button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:10px;background:var(--ac);color:#04231a;font-size:16px;font-weight:700;cursor:pointer}
  button.sec{background:transparent;border:1px solid var(--bd);color:var(--tx);margin-top:10px}
  button:disabled{opacity:.6}
  details summary{cursor:pointer;color:var(--mut);font-size:14px;margin-top:14px}
  textarea{width:100%;height:110px;border-radius:10px;border:1px solid var(--bd);background:#0f1420;color:var(--tx);padding:10px;font:12px monospace;resize:none}
  img.qr{display:block;margin:12px auto;width:200px;background:#fff;padding:8px;border-radius:10px}
  .err{color:#ff7b7b;margin-top:12px;font-size:14px}
  .badge{display:inline-block;padding:4px 10px;border-radius:99px;font-size:13px;background:#3a3220;color:#ffcf5c}
  .badge.paid{background:#173d2e;color:var(--ac)}
  .hide{display:none}
</style>
</head>
<body>
<main>
  <h1>Gerador de PIX</h1>

  <div class="card" id="login">
    <label>Senha de acesso</label>
    <input id="senha" type="password" placeholder="Senha do gerador">
    <button id="entrar">Entrar</button>
  </div>

  <div class="card hide" id="form">
    <label>Valor (R$)</label>
    <input id="valor" class="valor" inputmode="decimal" placeholder="0,00">
    <label>Descrição</label>
    <input id="descricao" placeholder="Ex: Serviço de design">
    <details>
      <summary>Dados do cliente (opcional)</summary>
      <label>Nome</label><input id="nome">
      <label>CPF/CNPJ</label><input id="cpf" inputmode="numeric">
      <label>E-mail</label><input id="email" type="email">
      <label>Telefone</label><input id="telefone" inputmode="tel">
    </details>
    <button id="gerar">Gerar PIX</button>
    <div class="err" id="erro"></div>
  </div>

  <div class="card hide" id="resultado">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong id="rvalor"></strong><span class="badge" id="rstatus">Aguardando</span>
    </div>
    <img class="qr" id="qr" alt="QR Code">
    <textarea id="copia" readonly></textarea>
    <button id="copiar">Copiar código PIX</button>
    <button class="sec" id="zap">Enviar por WhatsApp</button>
    <button class="sec" id="novo">Gerar outro</button>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let senha = sessionStorage.getItem('senha') || '', poll, cur;

const api = (path, opt = {}) => fetch(path, { ...opt, headers: { 'Content-Type': 'application/json', 'x-app-password': senha } });
const brl = n => n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
function show(id) { ['login', 'form', 'resultado'].forEach(x => $(x).classList.toggle('hide', x !== id)); }

async function init() {
  // descobre se precisa de senha testando o status com id inválido
  const r = await api('/api/status?id=x');
  show(r.status === 401 ? 'login' : 'form');
}
$('entrar').onclick = async () => {
  senha = $('senha').value; sessionStorage.setItem('senha', senha);
  const r = await api('/api/status?id=x');
  if (r.status === 401) { $('senha').value = ''; $('senha').placeholder = 'Senha incorreta'; } else show('form');
};

$('gerar').onclick = async () => {
  $('erro').textContent = ''; $('gerar').disabled = true; $('gerar').textContent = 'Gerando...';
  const valor = parseFloat($('valor').value.replace(/\./g, '').replace(',', '.'));
  try {
    const r = await api('/api/pix', { method: 'POST', body: JSON.stringify({
      valor, descricao: $('descricao').value, nome: $('nome').value, cpf: $('cpf').value,
      email: $('email').value, telefone: $('telefone').value }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Erro');
    cur = j;
    $('rvalor').textContent = brl(j.valor);
    $('qr').src = j.qrCode; $('copia').value = j.copiaECola;
    setStatus('PENDING'); show('resultado');
    clearInterval(poll);
    poll = setInterval(async () => {
      const s = await (await api('/api/status?id=' + j.id)).json();
      if (s.status) setStatus(s.status);
      if (s.status && s.status !== 'PENDING') clearInterval(poll);
    }, 5000);
  } catch (e) { $('erro').textContent = e.message; }
  $('gerar').disabled = false; $('gerar').textContent = 'Gerar PIX';
};
function setStatus(s) {
  const b = $('rstatus');
  b.textContent = { PENDING: 'Aguardando pagamento', PAID: 'Pago ✓', CANCELLED: 'Expirado' }[s] || s;
  b.classList.toggle('paid', s === 'PAID');
}
$('copiar').onclick = async () => {
  try { await navigator.clipboard.writeText(cur.copiaECola); } catch { $('copia').select(); document.execCommand('copy'); }
  $('copiar').textContent = 'Copiado!'; setTimeout(() => $('copiar').textContent = 'Copiar código PIX', 1500);
};
$('zap').onclick = () => {
  const msg = `Olá! Segue o PIX copia e cola no valor de ${brl(cur.valor)}:\n\n${cur.copiaECola}`;
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
};
$('novo').onclick = () => { clearInterval(poll); $('valor').value = ''; $('descricao').value = ''; show('form'); };
init();
</script>
</body>
</html>
